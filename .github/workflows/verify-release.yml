name: Verify and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Run repository checks
        run: ./tests/ci.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate version tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: echo "kind=$(scripts/release-version.sh "$RELEASE_TAG")" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_KIND: ${{ steps.version.outputs.kind }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_KIND" == prerelease ]]; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --notes "PRE-RELEASE. Not production-ready. For evaluation only." --prerelease --latest=false --title "$RELEASE_TAG (pre-release)"
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
