# Fallback menu for EFI/cachyos/grubx64-custom.efi (prefix (...,gpt1)/grub).
# All paths use ($root), which is the ESP itself.
# No Btrfs read is required here.

set timeout=5
set default="cachyos-esp-b"
if [ -f ($root)/grub/slot.cfg ]; then
    source ($root)/grub/slot.cfg
fi

insmod efi_gop
insmod font
if loadfont ($root)/grub/themes/astronaut/JetBrainsMono_34.pf2; then
    set gfxmode=2880x1800,auto
    insmod gfxterm
    terminal_output gfxterm
    insmod gfxmenu
    insmod png
    loadfont ($root)/grub/themes/astronaut/JetBrainsMono_22.pf2
    set theme=($root)/grub/themes/astronaut/theme.txt
    export theme
fi

menuentry "CachyOS - slot A" --class cachyos --id cachyos-esp-a {
    linux ($root)/EFI/cachyos-boot/slot-a/vmlinuz root=UUID=4ee3417c-1618-45ac-9e95-463c34adf9e8 rw rootflags=subvol=@ panic=10 hung_task_panic=1 log_buf_len=8M nvme_load=YES splash loglevel=3 resume=UUID=bc715af5-53ed-470a-8033-48b4cd1858bb
    initrd ($root)/EFI/cachyos-boot/slot-a/initramfs
}

menuentry "CachyOS - slot B" --class cachyos --id cachyos-esp-b {
    linux ($root)/EFI/cachyos-boot/slot-b/vmlinuz root=UUID=4ee3417c-1618-45ac-9e95-463c34adf9e8 rw rootflags=subvol=@ panic=10 hung_task_panic=1 log_buf_len=8M nvme_load=YES splash loglevel=3 resume=UUID=bc715af5-53ed-470a-8033-48b4cd1858bb
    initrd ($root)/EFI/cachyos-boot/slot-b/initramfs
}

menuentry "Recovery (TTY)" {
    linux ($root)/EFI/cachyos-recovery/vmlinuz-linux-cachyos root=UUID=4ee3417c-1618-45ac-9e95-463c34adf9e8 rootflags=subvol=@ rw systemd.unit=multi-user.target loglevel=4
    initrd ($root)/EFI/cachyos-recovery/initramfs-linux-cachyos.img
}

menuentry "Windows" --class windows {
    chainloader ($root)/EFI/Microsoft/Boot/bootmgfw.efi
}

menuentry "GRUB command line" {
    commandline
}
