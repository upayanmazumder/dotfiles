# Minimal initramfs for ESP boot copies (no early KMS, no Plymouth).
# Generated by the ESP boot sync hook. Keep in sync with /etc/mkinitcpio.conf HOOKS
# except kms and plymouth.
MODULES=()
BINARIES=()
FILES=()
HOOKS=(base systemd autodetect microcode modconf block keyboard sd-vconsole resume filesystems)
COMPRESSION="zstd"
