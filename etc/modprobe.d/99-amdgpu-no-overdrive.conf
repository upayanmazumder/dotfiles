# Disable amdgpu Overdrive (manual clock/voltage control) on this iGPU
# laptop -- see docs/machine.md "GPU / power / thermals" for why.
#
# An older, conflicting /etc/modprobe.d/99-amdgpu-overdrive.conf sets
# ppfeaturemask=0xfff7ffff and must be removed during deployment. It
# follows this drop-in in modprobe --showconfig and the running driver
# currently reports 0xfff7ffff, so merely installing this file alongside
# the older one does not disable Overdrive. Do not copy that old file.
#
# The linux-cachyos driver default is 0xfff7ffff even without that old
# drop-in. Clear only bit 14 (PP_OVERDRIVE_MASK), leaving the other
# feature bits unchanged: 0xfff7ffff & ~0x4000 = 0xfff7bfff.
options amdgpu ppfeaturemask=0xfff7bfff
