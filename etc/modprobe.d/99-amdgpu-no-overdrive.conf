# Disable amdgpu Overdrive (manual clock/voltage control) on this iGPU
# laptop -- see docs/machine.md "GPU / power / thermals" for why.
#
# Correction, 2026-09-16: an earlier file at this same path
# (99-amdgpu-overdrive.conf, since removed) was believed to be the SOURCE
# of Overdrive and deleted for that reason on 2026-09-15. After a reboot,
# /sys/module/amdgpu/parameters/ppfeaturemask still read 0xfff7ffff --
# identical to before deletion. Root cause: 0xfff7ffff (bit 14 /
# PP_OVERDRIVE_MASK set) is `linux-cachyos`'s own compiled-in driver
# default on this machine, confirmed via `modprobe --showconfig` showing
# no ppfeaturemask setting anywhere once the file was gone. The deleted
# file had been setting the SAME value the kernel already defaults to --
# redundant, not causal. Removing it could never have disabled Overdrive.
#
# This file does the opposite of the deleted one: it clears only the
# Overdrive bit from the kernel's own default (0xfff7ffff & ~0x4000 =
# 0xfff7bfff), leaving every other CachyOS-chosen feature bit untouched.
options amdgpu ppfeaturemask=0xfff7bfff
