# Persistent fix for MT7922 (mt7921e driver) MCU firmware-download hang.
#
# Root cause (2026-08-10): PCIe ASPM (Active State Power Management) puts
# the MT7922 card into a low-power link state that races with the
# driver's MCU firmware/patch handshake. Once wedged, the driver retries
# "Failed to get patch semaphore" / "chip reset failed" forever and never
# recovers; NetworkManager toggling the radio (rfkill soft-block on/off)
# during this state is what triggers the actual lockup, and the driver's
# ->remove() path then hangs the kernel task in D state trying to tear
# down a chip that will never respond (unrecoverable without reboot).
#
# disable_aspm keeps the PCIe link in a stable active state so the MCU
# firmware handshake never races a link-power transition. Documented
# mt7921e module option (see: modinfo -p mt7921e).
options mt7921e disable_aspm=y
