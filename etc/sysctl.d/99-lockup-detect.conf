# Detect hard lockups and stuck tasks. Both panic, and panic=10 reboots, so a
# freeze no longer needs a power-button reset.
#
# This file must sort after /usr/lib/sysctl.d/70-cachyos-settings.conf, which
# sets kernel.nmi_watchdog = 0 for power saving. The kernel does not accept
# hardlockup_panic= on its command line on this build, so set it here.
kernel.watchdog = 1
kernel.nmi_watchdog = 1
kernel.hardlockup_panic = 1
