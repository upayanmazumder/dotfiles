# Tailnet-only OpenSSH endpoint for Android SSH/SFTP clients.
# Tailscale SSH keeps tailnet port 22. OpenSSH listens on loopback (local use)
# and on the Tailscale addresses only, on port 2222. No wildcard listener.
ListenAddress 127.0.0.1:22
ListenAddress [::1]:22
ListenAddress 100.94.169.60:2222
ListenAddress [fd7a:115c:a1e0::992e:a93d]:2222

PubkeyAuthentication yes
PermitRootLogin no
