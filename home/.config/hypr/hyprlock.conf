# Catppuccin Mocha. Keep authentication in Hyprlock and PAM.
general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = ease, 0.05, 0.7, 0.1, 1.0
    animation = fadeIn, 1, 3, ease
    animation = fadeOut, 1, 2, ease
}

# A fixed image keeps the desktop private while locked.
background {
    monitor =
    path = ~/.config/hypr/hyprlock/sonder-mountain-4k.jpg
    color = rgba(1e1e2eff)
}

label {
    monitor =
    text = $TIME12
    color = rgba(cdd6f4ff)
    font_size = 108
    font_family = Google Sans Flex Medium
    position = 0, 250
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgba(a6adc8ff)
    font_size = 18
    font_family = Google Sans Flex Medium
    position = 0, 165
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(cdd6f4ff)
    font_size = 18
    font_family = Google Sans Flex Medium
    position = 0, 55
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 58
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.3
    dots_center = true
    rounding = 14
    outer_color = rgba(45475aff)
    inner_color = rgba(313244ff)
    check_color = rgba(b4befeff)
    fail_color = rgba(f38ba8ff)
    font_color = rgba(cdd6f4ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##a6adc8">Enter password</span>
    fail_text = <span foreground="##f38ba8">$FAIL ($ATTEMPTS)</span>
    position = 0, -15
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/check-capslock.sh
    color = rgba(f38ba8ff)
    font_size = 14
    font_family = Google Sans Flex Medium
    position = 0, -70
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:5000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/status.sh
    color = rgba(a6adc8ff)
    font_size = 14
    font_family = Google Sans Flex Medium
    position = 30, -30
    halign = left
    valign = top
}

label {
    monitor =
    text = cmd[update:600000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/weather.sh
    color = rgba(a6adc8ff)
    font_size = 14
    font_family = Google Sans Flex Medium
    position = -30, -30
    halign = right
    valign = top
}

label {
    monitor =
    text = $LAYOUT
    color = rgba(a6adc8ff)
    font_size = 14
    font_family = Google Sans Flex Medium
    position = -30, 30
    halign = right
    valign = bottom
}

# Media stays in the lower corner and disappears when no player is active.
image {
    monitor =
    path = ~/.config/hypr/hyprlock/blank.png
    size = 108
    rounding = 14
    border_size = 0
    reload_time = 2
    reload_cmd = ~/.config/hypr/hyprlock/albumart.sh
    position = 36, 100
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:5000] ~/.config/hypr/hyprlock/media.sh
    color = rgba(cdd6f4ff)
    font_size = 20
    font_family = Google Sans Flex Medium
    position = 160, 100
    halign = left
    valign = bottom
}
