# 99-audio-quality.conf
#
# User-level PipeWire tuning for the HP 14-ey0789au audiophile setup.
# Drop-in files here override /usr/share/pipewire/pipewire.conf without
# touching the vendor file (see comment at the top of that file).
#
# WHAT THIS CHANGES AND WHY
# --------------------------
# default.clock.allowed-rates: adds 44100 Hz alongside the distro default
# of 48000 Hz. Most music (CD-quality FLAC/MP3/streaming) is mastered at
# 44.1 kHz. Without this, PipeWire's resampler silently converts every
# 44.1 kHz stream to 48 kHz (and often back again inside Bluetooth/ALSA),
# adding an avoidable sample-rate-conversion step. Allowing both means
# PipeWire switches the graph's *native* rate to match whichever stream
# is currently playing, with no forced resampling, and reverts when idle.
# This is the standard, low-risk PipeWire recommendation for this exact
# situation (see `man pipewire.conf` / PipeWire wiki "Config-Format").
#
# WHAT THIS DELIBERATELY DOES NOT CHANGE
# ----------------------------------------
# - No forced default.clock.rate override: PipeWire keeps auto-selecting
#   from allowed-rates instead of being pinned, so nothing about current
#   playback behavior regresses.
# - No 96/192 kHz added: the internal HDA speakers, both Bluetooth
#   earbuds' likely codecs (SBC/AAC/aptX/LDAC), and virtually all source
#   material top out at 48 kHz; forcing higher rates would only add CPU
#   load and a real (if small) risk of Bluetooth resync glitches for zero
#   audible benefit.
# - No quantum/latency overrides: the distro defaults (quantum 1024,
#   min-quantum 32, max-quantum 2048) already adapt automatically per
#   application need and showed zero xruns/underruns in
#   `journalctl --user -u pipewire` at audit time, i.e. already stable.
#   Forcing a fixed lower quantum system-wide is the classic cause of
#   crackling on battery/power-saving laptops, so it is intentionally
#   left alone per the "no risky changes" constraint.
#
# To revert: delete this file (or restore the .bak-* backup if present)
# and restart pipewire: `systemctl --user restart pipewire pipewire-pulse wireplumber`

context.properties = {
    default.clock.allowed-rates = [ 44100 48000 ]
}
