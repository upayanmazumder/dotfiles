# 53-bluetooth-a2dp-only.conf
#
# WHAT THIS FIXES
# ----------------
# Multi-second lag / hang whenever a Bluetooth output (OnePlus Buds 4,
# JBL TUNE510BT) connects or disconnects, and occasional playback drop
# with no automatic recovery.
#
# Root cause (from journalctl --user -u wireplumber + bluetoothd, 2026-09-24):
#   bluetoothd: "Unable to get io data for Hands-Free Voice gateway:
#                getpeername: Transport endpoint is not connected"
#   wireplumber: "spa.bluez5.sink.media: connection ... terminated
#                 unexpectedly" -> node running -> error
#
# By default WirePlumber's bluez5 monitor advertises HFP (telephony/
# voice) roles (hfp_hf, hfp_ag) in addition to A2DP for every paired
# device. Any mic-capturing client (e.g. Discord's persistent "WEBRTC
# VoiceEngine" stream, per 52-bluetooth-no-headset-autoswitch.conf)
# makes BlueZ try to stand up the Hands-Free voice-gateway channel on
# these earbuds. That HFP channel is unreliable on this hardware and
# dies, and killing it currently tears down the *entire* bluez audio
# node -- not just the HFP leg -- so PipeWire has to fully recreate the
# Bluetooth output instead of doing a clean switch. That teardown and
# recreate is the lag.
#
# 52-bluetooth-no-headset-autoswitch.conf already establishes the
# policy that these devices should never carry call audio (voice chat
# falls back to the built-in mic instead). This file goes one step
# further and stops BlueZ from negotiating HFP for them at all, so the
# flaky channel is never opened and can never crash the node.
#
# WHAT THIS DELIBERATELY DOES NOT CHANGE
# ----------------------------------------
# - a2dp_sink / a2dp_source / bap_sink / bap_source stay enabled:
#   normal stereo playback (and any A2DP/LE-audio mic use) is
#   unaffected.
# - hfp_hf / hfp_ag are the only roles dropped; add them back (see
#   stock example at
#   /usr/share/doc/wireplumber/examples/wireplumber.conf.d/bluetooth.conf)
#   if this machine ever needs BT hands-free call audio.
#
# To revert: delete this file and restart:
# systemctl --user restart wireplumber pipewire-pulse

monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source bap_sink bap_source ]
}
