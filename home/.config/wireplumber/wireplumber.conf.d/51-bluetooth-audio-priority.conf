# 51-bluetooth-audio-priority.conf
#
# WHAT THIS FIXES
# ----------------
# Any connected Bluetooth headset/headphones (OnePlus Buds 4, JBL
# TUNE510BT, or anything paired later e.g. Infinity headphones) must
# always outrank the laptop's built-in speakers as the hardware sink
# that audio (via the EasyEffects virtual sink) actually renders to.
#
# Upstream WirePlumber scores these almost identically:
#   - Bluetooth a2dp-sink node:            priority.session = 1010
#   - Built-in analog speaker (dev 0):     priority.session = 1000 + 9 = 1009
# (see /usr/share/wireplumber/scripts/monitors/{alsa,bluez}.lua)
# A 1-point gap is not a policy, it's an accident of enumeration order/
# subdevice numbering. Any driver/profile change can flip which one
# "wins", so BT vs. speaker selection was effectively undefined.
#
# This file makes it deterministic: Bluetooth outputs get a priority
# far above every ALSA output; the built-in speaker gets a low priority
# so it is only chosen as the default hardware sink when no Bluetooth
# output is connected. Other outputs (e.g. HDMI/DP on the Radeon GPU)
# are left at stock priority.
#
# Reload after editing: systemctl --user restart wireplumber wireplumber-pulse pipewire-pulse
# (or just `wpctl reload`, but a full restart is more reliable).

monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_output\\..*" }
    ]
    actions = {
      update-props = {
        priority.session = 2500
        priority.driver  = 2500
      }
    }
  }
]

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.pci-0000_04_00.6.HiFi__Speaker__sink" }
    ]
    actions = {
      update-props = {
        priority.session = 200
        priority.driver  = 200
      }
    }
  }
]
