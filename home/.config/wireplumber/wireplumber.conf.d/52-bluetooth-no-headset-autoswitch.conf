# 52-bluetooth-no-headset-autoswitch.conf
#
# WHAT THIS FIXES
# ----------------
# Garbled/muffled Bluetooth output audio (JBL TUNE510BT and similar).
#
# Root cause: WirePlumber's autoswitch-bluetooth-profile.lua script
# force-switches a BT device's profile to headset-head-unit (HSP/HFP,
# mSBC/CVSD codec, mono 16kHz) whenever any client links to the device's
# loopback source node -- including apps like Discord, which keep a
# "WEBRTC VoiceEngine" mic stream open persistently (for input-sensitivity
# detection etc.) even when not actually in a call. Once switched, the
# card only advertises headset-head-unit(-cvsd) profiles -- a2dp-sink
# disappears from `pactl list cards` entirely -- so all *playback* also
# drops to mono 16kHz, sounding garbled, until something releases the mic
# stream and the script switches back (which can also fail to happen, per
# "s-device: Could not find valid non-headset profile, not switching" in
# journalctl --user -u wireplumber).
#
# Combined with 51-bluetooth-audio-priority.conf (BT should always win as
# the output sink), the better tradeoff on this machine is: never let a
# mic-only client degrade BT output quality. Bluetooth headsets stay on
# a2dp-sink (high quality, output-only); voice chat apps fall back to a
# built-in mic input automatically since the BT source won't exist in
# that profile.
#
# Reload after editing: systemctl --user restart wireplumber wireplumber-pulse pipewire-pulse

wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
